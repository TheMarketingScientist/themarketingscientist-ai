name: Deploy Quarto Site

on:
  push:
    branches:
      - GH_Pages  # Runs when you push to GH_Pages

permissions:
  contents: write

concurrency:
  group: deploy-gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GH_Pages branch
        uses: actions/checkout@v4
        with:
          ref: GH_Pages
          fetch-depth: 0  # Ensure full history is available

      - name: Validate deployment artifact
        run: |
          if [ ! -d "_site" ]; then
            echo "Error: _site folder missing, deployment canceled."
            exit 1
          fi
          if [ -e "_site/index.html" ]; then
            echo "Error: _site/index.html must not overwrite the manually maintained homepage."
            exit 1
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
          publish_branch: gh-pages
          keep_files: true  # Keeps your home page and other files
